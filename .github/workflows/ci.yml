name: CI

on:
  pull_request:
  push:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck build
      - run: pnpm turbo run test --filter=!@moodfood/intelligence  # pytest runs in its own job

  intelligence:
    name: Intelligence (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: moodfood
          POSTGRES_PASSWORD: moodfood
          POSTGRES_DB: moodfood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moodfood" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/intelligence/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: pytest on Postgres + pgvector (fresh schema per test)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://moodfood:moodfood@localhost:5432/moodfood
